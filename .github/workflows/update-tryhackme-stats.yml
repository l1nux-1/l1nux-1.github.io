name: Update TryHackMe stats

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser-grade HTTP client
        run: python -m pip install --disable-pip-version-check curl-cffi

      - name: Refresh profile data
        run: python .github/scripts/update_stats.py

      - name: Commit updated stats
        run: |
          if git diff --quiet -- data/stats.json; then
            echo "Stats are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git commit -m "chore: refresh TryHackMe stats"
          git push
